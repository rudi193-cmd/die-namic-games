# Die-Namic's CI: the jobs safe-app-store's store-ci ran for these pieces while
# they lived at apps/game, carried over when Die-Namic was lifted out
# (2026-11-16), each as it was.
#
#   die-namic       Die-Namic's own tests (tests/: the box, the games, the core),
#                   on the willow its pin names, from the repo root with a bare
#                   pytest, as the store's promotion gate runs them
#   game-lab-sims   game-lab's sims run and return measured shape
#   ai-game-master  ai-game-master's guard tests
#   the-table       the-table's whole suite and its aetheris5e combat tests,
#                   with everything it reaches for checked out beside it (new
#                   here: it had no CI job in the store)
#
# And willow's maintainer add-ons, run from the willow the pin names (ci/
# holds what drives them; ci/README.md says what each is for):
#
#   plan            ci-cache's pip key for every job here, and the files
#                   mutants breaks, one job each
#   known           unpinned, agents-md-check, secrets-audit, ref-check and
#                   advisories (on osv.dev's PyPI database), every row held to
#                   ci/known.json: a new one fails, and so does a stale entry
#   mutants         willow's mutants, breaking Die-Namic's own code (one job a
#                   file): a break its tests miss fails
#   why             on a red run only: ci-why pulls each failing job's failing
#                   block out of its log, into the run's summary
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ci-cache reads the repo's lockfiles and prints the pip cache's key: every
  # requirements.txt here, lock/requirements.txt's exact pins among them. Each
  # job restores ~/.cache/pip on it, so a run whose pins haven't moved
  # downloads nothing. And mutants.json's files, so each gets its own job.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pip: ${{ steps.key.outputs.pip }}
      mutants: ${{ steps.key.outputs.mutants }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: die-namic-games

      - name: Which willow
        id: pin
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("die-namic-games/willow.pin.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/Willow
          ref: ${{ steps.pin.outputs.commit }}
          path: willow

      - name: ci-cache's key, and the files mutants breaks
        id: key
        run: |
          set -eo pipefail
          python3 willow/adapters/stdlib/ci-cache/ci_cache.py --from die-namic-games | tee "$RUNNER_TEMP/keys.txt"
          key=$(awk '$1 == "pip" {print $3}' "$RUNNER_TEMP/keys.txt")
          if [ -z "$key" ]; then
            echo "::error::ci-cache gave no pip key"
            exit 1
          fi
          echo "pip=$key" >> "$GITHUB_OUTPUT"
          echo "mutants=$(python3 -c 'import json; print(json.dumps(list(json.load(open("die-namic-games/ci/mutants.json"))["targets"])))')" >> "$GITHUB_OUTPUT"

  # Die-Namic plays willow's add-ons where they live: its tests need a willow
  # checkout, and only the one willow.pin.json names. So this job reads the
  # pin's commit, checks willow out at it, and runs the tests on it
  # (box/willow_pin.py refuses a checkout whose files differ). The end-of-night
  # test reads a handwritten page with willow's ocr add-on, so tesseract and
  # ocr's requirements are installed here, and the job fails if they don't
  # import. box/fight.py plays aetheris5e's fights, whose dice are willow-bot's
  # one-script's, so willow-bot is checked out too, with aetheris5e's `dice`
  # at its pin. And it fails if anything skipped.
  die-namic:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ needs.plan.outputs.pip }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Which willow
        id: pin
        shell: bash
        run: |
          echo "commit=$(python -c 'import json; print(json.load(open("willow.pin.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/Willow
          ref: ${{ steps.pin.outputs.commit }}
          path: willow
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/willow-bot
          path: willow-bot

      # The key these tests' verdict stands on (ci/memo.py): the bytes of every
      # file they can reach, the Python, the runner, and the commit of
      # willow-bot (checked out at its head, so the tree doesn't say which). A
      # pull request whose key is one main already passed on stands on that
      # verdict and skips the install and the tests; a push to main always runs
      # them, and saves the verdict for the next.
      - name: The key these tests stand on
        id: memo
        shell: bash
        run: |
          key=$(python ci/memo.py key --repo . --gate tests --extra "python=3.12" --extra "os=${{ runner.os }}" --extra "willow-bot=$(git -C willow-bot rev-parse HEAD)")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Main's verdict for these bytes
        id: held
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: memo-verdict
          key: memo-v1-${{ steps.memo.outputs.key }}
      - name: Stands on main's verdict
        if: steps.held.outputs.cache-hit == 'true'
        run: |
          echo "### tests: stands on main's verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "Every file these tests can reach is byte for byte one main's tests passed on (key \`${{ steps.memo.outputs.key }}\`, ci/memo.py), so they were not run again. The text of the verdict: $(cat memo-verdict/verdict.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: tesseract and ocr's requirements, and aetheris5e's dice
        if: steps.held.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          python -m pip install --upgrade pip >/dev/null
          pip install pytest -r willow/adapters/deps/ocr/requirements.txt -r the-table/aetheris5e/requirements.txt -c lock/requirements.txt
          python -c "import PIL, pypdf, dice; print('ocr can read here, and the fights can roll')"

      - name: Die-Namic's tests (the box, the games, the core), on the pinned willow
        if: steps.held.outputs.cache-hit != 'true'
        env:
          WILLOW_ROOT: ${{ github.workspace }}/willow
          ONESCRIPT_HOME: ${{ github.workspace }}/willow-bot/one-script
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/runs"
          python -m pytest -q -rs --junitxml="$RUNNER_TEMP/runs/run-${{ github.run_number }}.xml" | tee "$RUNNER_TEMP/game.txt"
          if grep -qi "skipped" "$RUNNER_TEMP/game.txt"; then
            echo "::error::a test skipped in the job that exists to run it"
            exit 1
          fi

      # Where the time went (willow's slow-tests, from the pin): the slowest
      # tests and files of this run, in the run's summary. It reads the run's
      # junit file and writes nothing else; it never fails the job.
      - name: Where the tests' time went
        if: steps.held.outputs.cache-hit != 'true'
        run: |
          {
            echo "### tests: where the time went"
            echo '```'
            python willow/adapters/stdlib/slow-tests/slow_tests.py --runs "$RUNNER_TEMP/runs" --top 8 || echo "(slow-tests couldn't read the run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this verdict for the next pull request on these bytes
        if: success() && steps.held.outputs.cache-hit != 'true'
        run: |
          mkdir -p memo-verdict
          echo "passed at $GITHUB_SHA, run $GITHUB_RUN_ID (key ${{ steps.memo.outputs.key }})" > memo-verdict/verdict.txt
      - uses: actions/cache/save@v6
        if: success() && steps.held.outputs.cache-hit != 'true'
        with:
          path: memo-verdict
          key: memo-v1-${{ steps.memo.outputs.key }}

  # game-lab ships reference simulators, not a pytest suite: sims/ci_smoke.py
  # runs the eleven stdlib added-game engines under both policies at low N and
  # fails if any is missing its run() seam, raises, or returns a malformed
  # result. python-chess, the one real dependency (the core-five path:
  # baseline_core.py, chess_selfplay.py), is installed so those checks are real
  # rather than skipped. chess_selfplay.py runs its whole body at import (13
  # games, a hardcoded output path), so it gets a compile check only.
  game-lab-sims:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ needs.plan.outputs.pip }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the one real dependency (python-chess, core-five path), at its pin
        run: |
          python -m pip install --upgrade pip
          pip install -r game-lab/requirements.txt -c lock/requirements.txt

      - name: The gate can fail — prove it catches its own breakage
        working-directory: game-lab/sims
        run: python ci_smoke.py --self-test

      - name: Sims run and return measured shape (11 engines x 2 policies + import checks)
        working-directory: game-lab/sims
        run: python ci_smoke.py

  ai-game-master:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ needs.plan.outputs.pip }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Its guard tests
        working-directory: ai-game-master
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install pytest -r requirements.txt
          python -m pytest tests/ -q

  # the-table reaches outside this repo, and finds each piece beside it, as
  # the_table/host.py and its adapters look: willow-bot's one-script (the
  # table's randomness and the record), willows-grove (the law a session is
  # held to, and the original experiments two tests replay against), and
  # safe-app-store (bureau and catgrid, the store apps it adapts). So this job
  # checks out all four side by side in the workspace, the layout the-table
  # expects on a person's machine, and names each by its variable too.
  # Each is taken at its default branch (the store's is master).
  #
  # The suite runs under pytest, which collects both its unittest classes and
  # test_peaks.py's plain test functions. It fails if anything skipped except
  # the two skips the data itself makes: the world those StorySession tests
  # drive has one seat, so there is no other seat to check (test_story_session,
  # "world has fewer than 2 seats"). Any other skip is something not reached.
  the-table:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ needs.plan.outputs.pip }}
      - uses: actions/checkout@v7
        with:
          path: die-namic-games
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/willow-bot
          path: willow-bot
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/willows-grove
          path: willows-grove
      - uses: actions/checkout@v7
        with:
          repository: rudi193-cmd/safe-app-store
          path: safe-app-store

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Its dependencies (python-chess, dice), at their pins
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install pytest -r die-namic-games/the-table/requirements.txt -r die-namic-games/the-table/aetheris5e/requirements.txt -c die-namic-games/lock/requirements.txt

      - name: the-table's suite, with everything it reaches for beside it
        working-directory: die-namic-games/the-table
        env:
          ONESCRIPT_HOME: ${{ github.workspace }}/willow-bot/one-script
          ONESCRIPT_DIR: ${{ github.workspace }}/willow-bot/one-script
          ONESCRIPT_GROVE: ${{ github.workspace }}/willows-grove
          SAFE_APP_STORE: ${{ github.workspace }}/safe-app-store
          TABLE_PLAY_PY: ${{ github.workspace }}/willows-grove/seat/willow/experiments/predictions-2026-10-17/play.py
          EXPERIMENT_PEAKS: ${{ github.workspace }}/willows-grove/seat/willow/experiments/foreshadow-2026-10-16/peaks.py
        run: |
          set -eo pipefail
          python -m pytest tests -q -rs | tee "$RUNNER_TEMP/the-table.txt"
          if grep "^SKIPPED" "$RUNNER_TEMP/the-table.txt" | grep -v "world has fewer than 2 seats"; then
            echo "::error::a test skipped that this job exists to run (only the one-seat world's two may)"
            exit 1
          fi

      - name: aetheris5e's combat tests
        working-directory: die-namic-games/the-table/aetheris5e
        env:
          ONESCRIPT_HOME: ${{ github.workspace }}/willow-bot/one-script
          SAFE_APP_STORE: ${{ github.workspace }}/safe-app-store
        run: python -m pytest test_combat.py -q -rs

  # willow's report add-ons on the repo, from the willow the pin names,
  # checked out beside it so none of willow's files is read as Die-Namic's.
  # ci/known.py runs each with --json and holds every row to ci/known.json:
  # a row it doesn't accept fails, and so does an entry no row matches.
  # advisories matches the locked pins to osv.dev's PyPI advisories, fetched
  # here each run, since the add-on fetches nothing itself.
  known:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: die-namic-games

      - name: Which willow
        id: pin
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("die-namic-games/willow.pin.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/Willow
          ref: ${{ steps.pin.outputs.commit }}
          path: willow

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: osv.dev's PyPI advisories
        run: |
          set -eo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/pypi.zip" https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip
          mkdir -p "$RUNNER_TEMP/osv" && unzip -q "$RUNNER_TEMP/pypi.zip" -d "$RUNNER_TEMP/osv"
          echo "$(ls "$RUNNER_TEMP/osv" | wc -l) advisories"

      - name: Every row known (unpinned, agents-md-check, secrets-audit, ref-check, advisories)
        run: python die-namic-games/ci/known.py --db "$RUNNER_TEMP/osv"

  # willow's mutants breaks Die-Namic's own code a few ways a file, and runs
  # the tests that cover it against each break (ci/mutants.json names both):
  # a break the tests pass on fails here, unless mutants.json accepts it with
  # the reason it is harmless. One job a file, so the box's slow tests run
  # side by side. Each needs what die-namic's job needs: the ocr add-on's
  # requirements and tesseract, for the end-of-night test.
  mutants:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.mutants) }}
    name: mutants (${{ matrix.file }})
    steps:
      - uses: actions/checkout@v7
        with:
          path: die-namic-games

      - name: Which willow
        id: pin
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("die-namic-games/willow.pin.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/Willow
          ref: ${{ steps.pin.outputs.commit }}
          path: willow
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/willow-bot
          path: willow-bot

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ needs.plan.outputs.pip }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The key this file's mutants verdict stands on (ci/memo.py), as the
      # tests job's: every file the suite can reach, the Python, the runner and
      # willow-bot's commit, and this file's name. Breaking a file against a
      # suite whose every input is byte for byte one main's passed on again
      # tells nothing new, and a job here is ten to twenty-five minutes. A push
      # to main always runs; a pull request stands on main's verdict.
      - name: The key this file's breaks stand on
        id: memo
        run: |
          key=$(python die-namic-games/ci/memo.py key --repo die-namic-games --gate "mutants:${{ matrix.file }}" --extra "python=3.12" --extra "os=${{ runner.os }}" --extra "willow-bot=$(git -C willow-bot rev-parse HEAD)")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Main's verdict for these bytes
        id: held
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: memo-verdict
          key: memo-v1-${{ steps.memo.outputs.key }}
      - name: Stands on main's verdict
        if: steps.held.outputs.cache-hit == 'true'
        run: |
          echo "### mutants (${{ matrix.file }}): stands on main's verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "Every file the suite can reach is byte for byte one main's breaks of this file were caught on (key \`${{ steps.memo.outputs.key }}\`, ci/memo.py), so they were not run again. The text of the verdict: $(cat memo-verdict/verdict.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: tesseract and ocr's requirements
        if: steps.held.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          python -m pip install --upgrade pip >/dev/null
          pip install pytest -r willow/adapters/deps/ocr/requirements.txt -r die-namic-games/the-table/aetheris5e/requirements.txt -c die-namic-games/lock/requirements.txt

      - name: Its breaks, each against its tests
        if: steps.held.outputs.cache-hit != 'true'
        run: python die-namic-games/ci/mutants.py run "${{ matrix.file }}"

      - name: Keep this verdict for the next pull request on these bytes
        if: success() && steps.held.outputs.cache-hit != 'true'
        run: |
          mkdir -p memo-verdict
          echo "caught at $GITHUB_SHA, run $GITHUB_RUN_ID (key ${{ steps.memo.outputs.key }})" > memo-verdict/verdict.txt
      - uses: actions/cache/save@v6
        if: success() && steps.held.outputs.cache-hit != 'true'
        with:
          path: memo-verdict
          key: memo-v1-${{ steps.memo.outputs.key }}

  # Only when a job above failed: ci-why reads each failed job's log and pulls
  # out the failing block (the test, its assertion, where), into this run's
  # summary, so the reason is the first thing on the page. It reads; it never
  # turns a run green or red.
  why:
    needs: [plan, die-namic, game-lab-sims, ai-game-master, the-table, known, mutants]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: die-namic-games

      - name: Which willow
        id: pin
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("die-namic-games/willow.pin.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/Willow
          ref: ${{ steps.pin.outputs.commit }}
          path: willow

      - name: Why each failed job failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' > "$RUNNER_TEMP/failed.tsv"
          {
            echo "## Why CI went red"
            while IFS=$'\t' read -r id name; do
              echo
              echo "### $name"
              echo '```'
              # curl, not gh api: gh refuses to print a log's terminal colour codes
              curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" -o "$RUNNER_TEMP/$id.log" \
                || echo "(its log couldn't be read)"
              python3 willow/adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/$id.log" || true
              echo '```'
            done < "$RUNNER_TEMP/failed.tsv"
          } | tee -a "$GITHUB_STEP_SUMMARY"
