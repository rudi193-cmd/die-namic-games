# Die-Namic's CI: the jobs safe-app-store's store-ci ran for these pieces while
# they lived at apps/game, carried over when Die-Namic was lifted out
# (2026-11-16), each as it was.
#
#   die-namic       Die-Namic's own tests (tests/: the box, the games, the core),
#                   on the willow its pin names, from the repo root with a bare
#                   pytest, as the store's promotion gate runs them
#   game-lab-sims   game-lab's sims run and return measured shape
#   ai-game-master  ai-game-master's guard tests
#
# Not run here, said plainly: the-table's suite. Its tests need willow-bot's
# one-script (and, for a session, willows-grove's law) beside this checkout,
# and its bureau and catgrid adapters need a safe-app-store checkout beside it
# (the_table/host.py; SAFE_APP_STORE). It had no CI job in the store either.
# Adding one is a step of its own: check out willow-memory/willow-bot (as the
# store's catgrid leg does) and rudi193-cmd/safe-app-store beside this repo,
# set ONESCRIPT_HOME and SAFE_APP_STORE, and run
# `python -m unittest discover -s tests -t .` from the-table/.
name: ci

on:
  push:
  pull_request:

jobs:
  # Die-Namic plays willow's add-ons where they live: its tests need a willow
  # checkout, and only the one willow.pin.json names. So this job reads the
  # pin's commit, checks willow out at it, and runs the tests on it
  # (box/willow_pin.py refuses a checkout whose files differ). The end-of-night
  # test reads a handwritten page with willow's ocr add-on, so tesseract and
  # ocr's requirements are installed here, and the job fails if they don't
  # import. And it fails if anything skipped.
  die-namic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Which willow
        id: pin
        shell: bash
        run: |
          echo "commit=$(python -c 'import json; print(json.load(open("willow.pin.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/Willow
          ref: ${{ steps.pin.outputs.commit }}
          path: willow

      - name: tesseract and ocr's requirements
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          python -m pip install --upgrade pip >/dev/null
          pip install pytest -r willow/adapters/deps/ocr/requirements.txt
          python -c "import PIL, pypdf; print('ocr can read here')"

      - name: Die-Namic's tests (the box, the games, the core), on the pinned willow
        env:
          WILLOW_ROOT: ${{ github.workspace }}/willow
        run: |
          set -eo pipefail
          python -m pytest -q -rs | tee "$RUNNER_TEMP/game.txt"
          if grep -qi "skipped" "$RUNNER_TEMP/game.txt"; then
            echo "::error::a test skipped in the job that exists to run it"
            exit 1
          fi

  # game-lab ships reference simulators, not a pytest suite: sims/ci_smoke.py
  # runs the eleven stdlib added-game engines under both policies at low N and
  # fails if any is missing its run() seam, raises, or returns a malformed
  # result. python-chess, the one real dependency (the core-five path:
  # baseline_core.py, chess_selfplay.py), is installed so those checks are real
  # rather than skipped. chess_selfplay.py runs its whole body at import (13
  # games, a hardcoded output path), so it gets a compile check only.
  game-lab-sims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: game-lab/requirements.txt

      - name: Install the one real dependency (python-chess, core-five path)
        run: |
          python -m pip install --upgrade pip
          pip install -r game-lab/requirements.txt

      - name: The gate can fail — prove it catches its own breakage
        working-directory: game-lab/sims
        run: python ci_smoke.py --self-test

      - name: Sims run and return measured shape (11 engines x 2 policies + import checks)
        working-directory: game-lab/sims
        run: python ci_smoke.py

  ai-game-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Its guard tests
        working-directory: ai-game-master
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install pytest -r requirements.txt
          python -m pytest tests/ -q
