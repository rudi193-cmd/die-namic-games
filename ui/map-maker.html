<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Map Maker · Die-Namic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: the card table under one lamp. The header wears the game's lid colour; the felt is that colour darkened; seats sit round the felt with your hand along the bottom; the side holds the scoresheet, the deck, the log and the record's commands. Every game turns on only the parts it has. One look on purpose. */
:root {
  --lid: #b8263f;
  --lid-ink: #fff0f2;
  --felt: color-mix(in srgb, var(--lid) 22%, #0d1513);
  --felt-2: color-mix(in srgb, var(--lid) 14%, #0a100f);
  --rail: color-mix(in srgb, var(--lid) 30%, #2a1a10);
  --chalk: #f4ecdc;
  --chalk-dim: #c6c0b2;
  --chalk-faint: #8d897e;
  --edge: #ffffff1c;
  --card: #fffaf0;
  --card-edge: #d8ccb4;
  --red: #c8352b;
  --black: #1f1d1a;
  --go: #ffd34d;
  --go-ink: #3a2a00;
  --lid-font: "Bowlby One", "Arial Black", Impact, sans-serif;
  --ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --prose: "Literata", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: #0b1110; color: var(--chalk); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }

.band { background: var(--lid); color: var(--lid-ink); }
.band-in, .wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-in { padding-block: 16px 18px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
.back { font-weight: 800; font-size: 0.85rem; color: inherit; text-decoration: none; opacity: 0.85; }
.back:hover { opacity: 1; text-decoration: underline; }
h1 { font-family: var(--lid-font); font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); line-height: 1; margin: 4px 0 0; }
.line { font-family: var(--prose); margin: 6px 0 0; max-width: 60ch; opacity: 0.9; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.toggle { font-weight: 700; font-size: 0.82rem; padding: 6px 12px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--lid-ink) 45%, transparent); }
.toggle[aria-pressed="true"] { background: var(--lid-ink); color: var(--lid); border-color: var(--lid-ink); }

.wrap { padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

/* the felt */
.felt {
  background: radial-gradient(120% 90% at 50% 40%, var(--felt), var(--felt-2));
  border: 10px solid var(--rail); border-radius: 22px;
  box-shadow: inset 0 0 40px #0008, 0 20px 40px -20px #000;
  padding: 16px; display: grid; gap: 14px; min-width: 0;
}
.status { text-align: center; font-weight: 700; font-size: 1rem; min-height: 1.5em; }
.status b { color: var(--go); }
.ring {
  display: grid; gap: 10px; min-width: 0;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
  grid-template-areas: ". north ." "west middle east";
  align-items: center;
}
.seat { display: grid; gap: 6px; justify-items: center; min-width: 0; text-align: center; }
.seat[data-seat="north"] { grid-area: north; }
.seat[data-seat="west"] { grid-area: west; }
.seat[data-seat="east"] { grid-area: east; }
.seat-name { font-weight: 800; font-size: 0.82rem; letter-spacing: 0.04em; display: flex; gap: 8px; align-items: baseline; justify-content: center; flex-wrap: wrap; }
.seat-name .meta { font-family: var(--mono); font-weight: 500; font-size: 0.72rem; color: var(--chalk-dim); }
.seat.turn .seat-name { color: var(--go); }
.seat.turn .seat-name::before { content: "▸ "; }
.middle { grid-area: middle; min-height: 190px; display: grid; place-items: center; gap: 10px; }
.stage { min-height: 260px; display: grid; place-items: center; gap: 10px; min-width: 0; } /* a game with no seats: its whole felt */
.mine { display: grid; gap: 8px; justify-items: center; }
.mine .seat-name { font-size: 0.9rem; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 40px; align-items: center; }
@media (max-width: 560px) {
  .ring { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "west north east" "middle middle middle"; }
  .felt { padding: 10px; border-width: 7px; }
  .seat .seat-name { flex-direction: column; align-items: center; gap: 0; }
  .seat .hand { max-width: 100%; overflow: hidden; }
  .seat .hand .pc { margin-left: -27px; }
  .seat .hand .pc:first-child { margin-left: 0; }
}

/* cards */
.hand { display: flex; justify-content: center; flex-wrap: nowrap; max-width: 100%; padding: 14px 4px 4px; }
.hand.mine-hand { flex-wrap: wrap; row-gap: 10px; }
.hand .pc { margin-left: calc(var(--overlap, -18px)); }
.hand .pc:first-child { margin-left: 0; }
.pc {
  --w: 62px; width: var(--w); aspect-ratio: 5 / 7; flex: none; position: relative;
  background: var(--card); color: var(--black); border-radius: 7px; border: 1px solid var(--card-edge);
  box-shadow: 0 3px 8px -3px #000c; font-family: var(--ui); font-weight: 800;
  transition: transform .15s ease, box-shadow .15s ease;
}
.pc.red { color: var(--red); }
.pc .ix { position: absolute; top: 4px; left: 5px; display: grid; justify-items: center; line-height: 0.95; font-size: calc(var(--w) * 0.24); }
.pc .ix i { font-style: normal; font-size: 0.85em; }
.pc .pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--w) * 0.5); padding-top: 12%; }
.pc .pip.face { font-family: var(--lid-font); font-weight: 400; font-size: calc(var(--w) * 0.42); }
.pc.img { background: transparent; border: 0; padding: 0; overflow: hidden; }
.pc.img img { display: block; width: 100%; height: 100%; object-fit: fill; border-radius: inherit; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toggle.pick { display: inline-flex; gap: 6px; align-items: center; padding: 4px 6px 4px 12px; }
.toggle.pick select { font: inherit; font-weight: 700; font-size: 0.8rem; color: inherit; background: transparent; border: 0; border-radius: 999px; padding: 2px 4px; max-width: 12rem; }
.toggle.pick select option { color: #111; }
.pc.back { background: repeating-linear-gradient(45deg, var(--lid) 0 5px, color-mix(in srgb, var(--lid) 55%, #fff) 5px 9px); border: 3px solid var(--card); }
.pc.small { --w: 34px; border-radius: 5px; }
.pc.small .ix { top: 2px; left: 3px; }
.pc.small .pip { display: none; }
.pc.big { --w: 84px; }
button.pc:not(:disabled):hover, button.pc.chosen { transform: translateY(-12px); box-shadow: 0 10px 16px -6px #000c; }
button.pc.chosen { outline: 3px solid var(--go); outline-offset: 1px; }
button.pc:disabled { filter: brightness(0.62) saturate(0.6); }
.mine-hand button.pc:disabled { transform: none; }
.mine-hand.quiet button.pc:disabled { filter: none; } /* hints off: not your turn reads as waiting, not as wrong */
.pile { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

/* dice: a d6 by its pips, any other die as its shape with its number */
.dice-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.d6 {
  --s: 44px; width: var(--s); height: var(--s); flex: none; border-radius: calc(var(--s) * 0.2);
  background: #fffaf0; box-shadow: inset 0 -3px 0 #d9ccb4, 0 4px 8px -4px #000c;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--s) * 0.16);
}
.d6 b { width: calc(var(--s) * 0.17); height: calc(var(--s) * 0.17); border-radius: 50%; background: #2a1f22; place-self: center; visibility: hidden; }
.d6 b.on { visibility: visible; }
.d6.small { --s: 26px; }
.d6.big { --s: 64px; }
.d6.hidden { background: #3a3430; box-shadow: inset 0 -3px 0 #221d1a, 0 4px 8px -4px #000c; }
.d6.hidden b { display: none; }
.d6.dim, .dn.dim { opacity: 0.32; }
.d6.mark { box-shadow: 0 0 0 3px var(--go), 0 4px 8px -4px #000c; }
.d6.wild b.on { background: var(--red); }
.dn { --s: 56px; width: var(--s); height: var(--s); flex: none; position: relative; display: grid; place-items: center; }
.dn svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dn span { position: relative; font-family: var(--lid-font); font-size: calc(var(--s) * 0.34); color: #2a1f22; line-height: 1; }
.dn small { position: absolute; bottom: -14px; font-family: var(--mono); font-size: 0.6rem; color: var(--chalk-faint); }
.roll-in { animation: roll-in .45s cubic-bezier(.3,.7,.4,1); }
@keyframes roll-in { 0% { transform: translateY(-14px) rotate(-160deg) scale(.8); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .roll-in { animation: none; } }
.seat.out { opacity: 0.4; }
.count { font-family: var(--mono); font-size: 0.75rem; color: var(--chalk-dim); text-align: center; }

.btn { border-radius: 9px; padding: 9px 18px; font-weight: 800; background: var(--go); color: var(--go-ink); }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: 0.4; }
.btn.ghost { background: transparent; color: var(--chalk); border: 2px solid var(--edge); }
.suit-pick { display: flex; gap: 8px; }
.suit-pick button { width: 46px; height: 46px; border-radius: 10px; background: var(--card); font-size: 1.5rem; color: var(--black); }
.suit-pick button.red { color: var(--red); }

/* the side */
.side { display: grid; gap: 14px; min-width: 0; }
.panel { border: 1px solid var(--edge); border-radius: 12px; padding: 14px; display: grid; gap: 10px; background: #ffffff06; min-width: 0; }
.panel h2 { margin: 0; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 800; }
.panel p { margin: 0; }
.note { font-size: 0.82rem; color: var(--chalk-faint); font-family: var(--prose); }
.sheet-wrap { overflow-x: auto; }
table.sheet { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.sheet th, .sheet td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--edge); white-space: nowrap; }
.sheet th:first-child, .sheet td:first-child { text-align: left; color: var(--chalk-dim); font-weight: 500; }
.sheet thead th { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--chalk-dim); }
.sheet thead th.you { color: var(--go); }
.sheet tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--chalk-faint); font-size: 0.95rem; }
.sheet td.lead { color: var(--go); }
.sheet .empty td { color: var(--chalk-faint); font-style: italic; text-align: left; }
.deck-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; }
.deck-row span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--chalk-dim); }
ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; font-size: 0.85rem; }
ol.log li { color: var(--chalk-dim); }
ol.log li b { color: var(--chalk); }
details.record summary { cursor: pointer; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 800; }
.cmds { margin: 10px 0 0; background: #00000055; border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 0.72rem; line-height: 1.7; white-space: pre; }
@media (prefers-reduced-motion: reduce) { .pc { transition: none; } }
</style>

<header class="band">
  <div class="band-in">
    <div>
      <a class="back" href="index.html">← all the games</a>
      <h1 id="title"></h1>
      <p class="line" id="line"></p>
    </div>
    <div class="toggles" id="toggles"></div>
  </div>
</header>

<div class="wrap">
  <main class="felt" id="felt">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="ring" id="ring" hidden>
      <div class="seat" data-seat="north"></div>
      <div class="seat" data-seat="west"></div>
      <div class="middle" id="middle"></div>
      <div class="seat" data-seat="east"></div>
    </div>
    <div class="stage" id="stage" hidden></div>
    <div class="mine" id="mine" hidden></div>
    <div class="actions" id="actions"></div>
  </main>
  <aside class="side">
    <div id="extra-panels" style="display:contents"></div>
    <section class="panel" id="p-score" hidden><h2 id="score-title">Scoresheet</h2><div class="sheet-wrap" id="score"></div><p class="note" id="score-note"></p></section>
    <section class="panel" id="p-deck" hidden><h2 id="deck-title">The deck</h2><div id="deck"></div></section>
    <section class="panel" id="p-log"><h2>The game so far</h2><ol class="log" id="log"></ol></section>
    <section class="panel" id="p-record"><p class="note" id="credit" style="margin:0 0 8px"></p><details class="record"><summary>Play it on the record</summary><div class="cmds" id="cmds"></div><p class="note" id="record-note" style="margin-top:8px"></p></details></section>
  </aside>
</div>

<script>
/* ---------- the frame: what every card game here shares ---------- */
const GAME = {"id": "map-maker", "title": "map maker", "summary": "Lay a story's town with the fair's tiles, dealt from seed words or by hand, and name its squares, wells and bridges as the world's places.", "commands": [], "notes": "", "came": "Made for Die-Namic on 2026-11-26 from Lantern Fair's tiles: a map kept in box/maps/ beside its world, lit at the Table and offered by write.py.", "checked": "", "card": "", "sketch": true, "name": "Map Maker", "lid": "#3b2f5c", "ink": "#fff3c4", "uses": ["fair-tiles"], "also": [], "decks": [], "maps": [{"world": "clockwork-cellar", "set": "cellar", "seed": "the clockwork cellar", "tiles": [[-2, -6, "bridge-stall", 2], [-1, -6, "square-three-mouth", 1], [-2, -5, "canal-bend", 0], [-3, -4, "square-edge", 1], [-2, -4, "square-edge", 3], [-1, -4, "square-three", 1], [-2, -3, "lane-stall", 3], [0, -3, "landing", 1], [1, -3, "lane-bend", 0], [-3, -2, "well", 0], [-2, -2, "lane-stall", 3], [-1, -2, "crossing", 3], [0, -2, "bridge", 2], [1, -2, "lane", 1], [2, -2, "bridge", 2], [-2, -1, "lane-bend", 1], [-1, -1, "lane-bend", 3], [0, -1, "canal", 2], [-3, 0, "square-corner", 2], [-2, 0, "lane", 2], [0, 0, "start", 0], [1, 0, "square-three-mouth", 1], [-2, 1, "crossing", 2], [0, 1, "canal", 2], [1, 1, "square-through", 2], [-3, 2, "fork", 1], [-2, 2, "lane-dark", 2], [1, 2, "square-mouth", 0], [2, 2, "square-three", 1], [1, 3, "square-corner-mouths", 2]], "places": [{"name": "The gear cellar", "at": "1,0:sq"}, {"name": "The mill stair", "at": "0,-3:ld"}]}, {"world": "ironworks-last-pour", "set": "ironworks", "seed": "the last pour", "tiles": [[0, -4, "well", 1], [0, -3, "bridge-stall", 1], [1, -3, "canal-bend", 3], [2, -3, "fork", 3], [-3, -2, "stall-end", 1], [0, -2, "square-three-mouth", 2], [1, -2, "square-edge", 3], [-3, -1, "lane-stall", 1], [-2, -1, "bridge", 2], [-1, -1, "lane", 1], [1, -1, "square-edge", 2], [-3, 0, "square-edge", 3], [-1, 0, "lane-dark", 3], [0, 0, "start", 0], [1, 0, "square-three-mouth", 1], [2, 0, "square-three", 0], [-3, 1, "lane", 3], [-1, 1, "canal", 1], [1, 1, "square-full", 3], [-3, 2, "square-mouth", 3], [-2, 2, "square-corner-mouths", 0], [-1, 2, "square-three", 2], [0, 2, "square-mouth", 3], [-2, 3, "lane-stall", 0], [-2, 4, "lane", 2], [-1, 4, "stall-end", 2], [0, 4, "square-through", 0], [-3, 5, "lane-stall", 0], [-2, 5, "lane-dark", 2], [-1, 5, "canal-bend", 1]], "places": [{"name": "the condemned gate", "at": "0,0:br"}, {"name": "the cooling hall", "at": "1,0:sq"}]}, {"world": "lantern-fair", "seed": "the lantern fair", "tiles": [[0, -5, "fork", 0], [1, -5, "canal-bend", 3], [1, -4, "square-edge", 1], [0, -3, "lane-bend", 0], [1, -3, "lane-bend", 2], [0, -2, "fork", 0], [1, -2, "bridge", 3], [-1, -1, "square-three", 3], [0, -1, "canal", 0], [0, 0, "start", 0], [1, 0, "lane", 1], [1, 1, "stall-end", 3], [2, 1, "lane-stall", 3], [3, 1, "lane-stall", 1], [4, 1, "lane-dark", 1], [-2, 2, "square-edge", 2], [-1, 2, "square-through", 0], [0, 2, "lane-bend", 1], [1, 2, "square-mouth", 1], [2, 2, "square-mouth", 3], [3, 2, "dark-end", 1], [1, 3, "lane", 1], [2, 3, "lane", 3], [1, 4, "landing", 0]], "places": [{"name": "The lantern bridge", "at": "0,0:br"}, {"name": "The stalls", "at": "1,1:c"}]}], "worlds": [{"id": "aetheris-the-waking-tide", "title": "Aetheris — The Waking Tide", "places": ["the seawall", "the engine gallery"]}, {"id": "clockwork-cellar", "title": "The Clockwork Cellar", "places": ["The mill stair", "The gear cellar"]}, {"id": "hasbeen-late-shift", "title": "Hasbeen — Late Shift", "places": ["the empty floor"]}, {"id": "ironworks-last-pour", "title": "Ironworks — Last Pour", "places": ["the condemned gate", "the cooling hall"]}, {"id": "lantern-fair", "title": "The Lantern Fair", "places": ["The stalls", "The lantern bridge"]}, {"id": "the-wasp-nest", "title": "The Wasp Nest", "places": ["The cellar ceiling", "Cogwen's workshop"]}]}; // this game's words, from its README, and its lid
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 120) : ms));
const rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
function shuffle(xs) { const a = xs.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const SEATS = ["north", "east", "south", "west"]; // as the record names them
const YOU = 2;
const SEAT_NAME = (i) => (i === YOU ? "You" : SEATS[i][0].toUpperCase() + SEATS[i].slice(1));

/* a standard card: rank 2..14, suit C D H S, written as the record writes it (QS, 10H) */
const SUIT_GLYPH = { C: "♣", D: "♦", H: "♥", S: "♠" };
const SUIT_NAME = { C: "clubs", D: "diamonds", H: "hearts", S: "spades" };
const RANK_TEXT = (r) => ({ 11: "J", 12: "Q", 13: "K", 14: "A" }[r] || String(r));
const cardName = (c) => RANK_TEXT(c.r) + c.s;
const said = (c) => RANK_TEXT(c.r) + SUIT_GLYPH[c.s];
const sameCard = (a, b) => a.r === b.r && a.s === b.s;
const deck52 = () => "CDHS".split("").flatMap((s) => Array.from({ length: 13 }, (_, i) => ({ r: i + 2, s })));
const sortHand = (h) => h.sort((a, b) => "CDHS".indexOf(a.s) - "CDHS".indexOf(b.s) || a.r - b.r);

/* willow-bot's seeded stream (sha256-stream/v1), as the add-ons draw from it:
   u32 is the first four bytes, big-endian, of SHA-256(seed || an 8-byte
   big-endian counter); below(k) by rejection. A seed given as text is
   SHA-256(text), as play-catgrid and play-life take --seed. So the same seed
   here builds the same board the record does. SHA-256 is synchronous on
   purpose: a board search draws thousands of times inside a recursion. */

/* oracle-text: a Tracery grammar, every branch picked by the stream seeded

  ed: (w) => (w.endsWith("e") ? w + "d" : w.length > 1 && w.endsWith("y") && !"aeiou".includes(w[w.length - 2]) ? w.slice(0, -1) + "ied" : w + "ed"),

const seedWords = () => { const w = ["lantern", "river", "gear", "goat", "bridge", "stall", "cellar", "kettle", "harbor", "willow", "fox", "comet"]; return `${w[rnd(w.length)]} ${100 + rnd(900)}`; };

/* dice: d6 by pips; others (d4, d8, d10, d12, d20, d100) as a shape with the number */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

  return `<div class="${cls}" role="img" aria-label="${label}">${[...Array(9)].map((_, i) => `<b class="${!o.hidden && (PIPS[n] || []).includes(i) ? "on" : ""}"></b>`).join("")}</div>`;
}
const SHAPE = {
  4: "50,6 94,88 6,88", 8: "50,4 92,50 50,96 8,50", 10: "50,4 94,40 50,96 6,40", 100: "50,4 94,40 50,96 6,40",
  12: "50,4 93,35 77,90 23,90 7,35", 20: "50,3 93,27 93,73 50,97 7,73 7,27",

/* card art: a fetched deck when one is chosen (decks/ID/QS.svg), else drawn here */
const RANK_FILE = (r) => ({ 10: "T", 11: "J", 12: "Q", 13: "K", 14: "A" }[r] || String(r));

  const cls = ["pc", o.size || "", o.extra || ""].join(" ");

  }

    const label = `${RANK_TEXT(c.r)} of ${SUIT_NAME[c.s]}`;

/* two switches, off unless you turn them on, remembered in this browser only:
   hints lights the cards the rules allow and says what to follow; open shows
   the other seats' hands, as the record plays them */
const remembered = (k) => { try { return localStorage.getItem(k) === "1"; } catch (e) { return false; } };
const remember = (k, v) => { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} };

const recall = (k, fallback) => { try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch (e) { return fallback; } };

const frame = {
  open: remembered("dn-open"),
  hints: remembered("dn-hints"),
  /* the art: a deck for the faces and a back, each by id, "" for drawn */
  deckId: "",
  backId: "",
  deckArt() { return (GAME.decks || []).find((d) => d.id === this.deckId) || null; },
  backArt() {
    if (!this.backId) return null;
    const [id, name] = this.backId.split("/");
    const d = (GAME.decks || []).find((x) => x.id === id);
    return d && d.backs.includes(name) ? `decks/${id}/back-${name}.svg` : null;
  },
  setup(opts) {
    document.documentElement.style.setProperty("--lid", GAME.lid);
    document.documentElement.style.setProperty("--lid-ink", GAME.ink);
    $("title").textContent = GAME.name;
    $("line").textContent = GAME.summary;
    $("cmds").textContent = GAME.commands.join("\n");
    $("record-note").textContent = "There the deal is seeded by the record's tip and every card is a row; here the shuffle is your browser's and nothing is kept.";
    $("ring").hidden = !opts.seats; $("mine").hidden = !opts.seats; $("stage").hidden = !!opts.seats;
    $("p-score").hidden = !opts.score; $("p-deck").hidden = !opts.deck;
    if (opts.scoreTitle) $("score-title").textContent = opts.scoreTitle;
    if (opts.deckTitle) $("deck-title").textContent = opts.deckTitle;

      this.deckId = recall(`dn-deck-${kind}`, decks[0].id);
      if (this.deckId && !decks.some((d) => d.id === this.deckId)) this.deckId = decks[0].id;
      const backs = decks.flatMap((d) => d.backs.map((b) => [`${d.id}/${b}`, `${d.name}: ${b.replace(/_/g, " ")}`]));

      if (backs.length) t.push(`<label class="toggle pick"><span>Back</span><select id="t-back">${[["", "Drawn"], ...backs].map(([v, l]) => `<option value="${esc(v)}" ${v === this.backId ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`);
    }

    const credit = () => { const d = this.deckArt(); $("credit").textContent = d ? `Cards: ${d.name}, by ${d.credit}. ${d.license}.` : ""; };
    const sel = (id, key, prop) => { const s = $(id); if (s) s.addEventListener("change", () => { this[prop] = s.value; try { localStorage.setItem(key, s.value); } catch (e) {} credit(); opts.redraw(); }); };

      const b = $(id);

  status(html) { $("status").innerHTML = html; },
  /* a move the rules refuse: name the rule, never the answer */
  refuse(rule) { $("status").innerHTML = `<span style="color:#ff9b85">Not allowed: ${esc(rule)}</span>`; },
  actions(html) { $("actions").innerHTML = html; },
  middle(html) { $("middle").innerHTML = html; },
  stage(html) { $("stage").innerHTML = html; },
  /* each other seat: its name, a line about it, and its hand, open or face down */
  /* a seat holding anything (a cup, a stack): its name, a line, and what the game draws there */
  seatAny(i, inner, o = {}) {
    const el = document.querySelector(`.seat[data-seat="${SEATS[i]}"]`);
    el.classList.toggle("turn", !!o.turn);
    el.classList.toggle("out", !!o.out);
    el.innerHTML = `<div class="seat-name">${esc(SEAT_NAME(i))}<span class="meta">${o.meta || ""}</span></div>${inner}`;
  },
  mineAny(inner, o = {}) {
    $("mine").innerHTML = `<div class="seat-name" style="${o.turn ? "color:var(--go)" : ""}">${o.turn ? "▸ " : ""}You · south<span class="meta">${o.meta || ""}</span></div>${inner}`;
  },
  seat(i, hand, o = {}) {
    const el = document.querySelector(`.seat[data-seat="${SEATS[i]}"]`);
    el.classList.toggle("turn", !!o.turn);
    const cards = this.open ? sortHand(hand.slice()).map((c) => cardHTML(c, { size: "small" })).join("") : hand.map(() => cardHTML(null, { size: "small" })).join("");
    el.innerHTML = `<div class="seat-name">${esc(SEAT_NAME(i))}<span class="meta">${o.meta || ""}</span></div><div class="hand" style="--overlap:${hand.length > 8 ? "-22px" : "-14px"}">${cards}</div>`;
  },
  /* your hand: buttons. With hints on, only the cards the rules allow are lit;

  mine(hand, o = {}) {

    el.innerHTML = `<div class="seat-name ${o.turn ? "" : ""}" style="${o.turn ? "color:var(--go)" : ""}">${o.turn ? "▸ " : ""}You · south<span class="meta">${o.meta || ""}</span></div>
      <div class="hand mine-hand ${this.hints ? "" : "quiet"}" style="--overlap:${hand.length > 10 ? "-24px" : "-8px"}">${hand.map((c) => cardHTML(c, { button: true, disabled: !can(c), chosen: chosen(c) })).join("")}</div>`;
  },
  /* the scoresheet: a column a seat, a row a hand, totals underneath */
  score({ cols, rows, totals, lead, note, empty, head = "Hand", you = YOU }) {
    $("score").innerHTML = `<table class="sheet"><thead><tr><th>${esc(head)}</th>${cols.map((c, i) => `<th class="${i === you ? "you" : ""}">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.map((r) => `<tr><td>${esc(r.label)}</td>${r.cells.map((v) => `<td>${v}</td>`).join("")}</tr>`).join("") : `<tr class="empty"><td colspan="${cols.length + 1}">${esc(empty || "No hands yet")}</td></tr>`}</tbody>
      ${totals ? `<tfoot><tr><td>Total</td>${totals.map((v, i) => `<td class="${lead && lead.includes(i) ? "lead" : ""}">${v}</td>`).join("")}</tr></tfoot>` : ""}</table>`;

  },
  /* the deck: what is where, in rows */
  deck(rows, note) {
    $("deck").innerHTML = rows.map(([k, v]) => `<div class="deck-row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("") + (note ? `<p class="note">${esc(note)}</p>` : "");
  },
  log(html) { const li = document.createElement("li"); li.innerHTML = html; $("log").prepend(li); },
  /* a side panel of the game's own, above the scoresheet: made once, its body redrawn */
  panel(id, title, html) {
    let p = $("p-" + id);
    if (!p) {
      p = document.createElement("section"); p.className = "panel"; p.id = "p-" + id;
      p.innerHTML = `<h2>${esc(title)}</h2><div id="${id}"></div>`;
      $("extra-panels").append(p);
    }
    if (html !== undefined) $(id).innerHTML = html;
    return $(id);
  },
  clearLog() { $("log").innerHTML = ""; },
};
</script>
<script>
/* The fair's tiles, shared by every page that lays them: Lantern Fair, the map

   draws them, and holds the board a finger pans and pinches. */
const N = 0, E = 1, So = 2, W = 3;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const MID = [[50, 0], [100, 50], [50, 100], [0, 50]];
const GOODS = ["spice", "silk", "sweets", "masks"];
const GOOD_COL = { spice: "#e0662f", silk: "#9a68d8", sweets: "#ee86b0", masks: "#e9c74a" };
const KIND_NAME = { L: "lane", C: "canal", P: "square" };

/* the tiles, edges N E S W; a segment joins the edges it names, and one with an

  { id: "well", n: 3, segs: [{ k: "L", e: [E], end: "well" }, { k: "L", e: [So], end: "well" }, { k: "L", e: [W], end: "well" }] },

  { id: "square-edge", n: 4, segs: [{ k: "P", e: [N] }] },
  { id: "square-mouth", n: 4, segs: [{ k: "P", e: [N] }, { k: "L", e: [So], end: "square" }] },
  { id: "square-corner", n: 3, segs: [{ k: "P", e: [N, E] }] },

/* a label on the board, upright whatever way its tile is turned; dy is where
   its tag sits from its point (above, by default) */
function labelSVG(px, py, text, cls = "", dy = -44) {
  const w = Math.max(40, text.length * 9.2 + 18);
  return `<g class="fb-label ${cls}"><circle cx="${px}" cy="${py}" r="9"/><rect x="${px - w / 2}" y="${py + dy}" width="${w}" height="26" rx="13"/><text x="${px}" y="${py + dy + 18}">${esc(text)}</text></g>`;
}
/* several labels laid together: a tag that would cover one already placed
   goes below its point, or further up, and the one lit is drawn last, on top */
function labelsSVG(items) {
  const placed = [], out = [];
  const order = items.slice().sort((a, b) => (a.cls === "here") - (b.cls === "here"));
  for (const it of [...order].sort((a, b) => (b.cls === "here") - (a.cls === "here"))) {
    const w = Math.max(40, it.text.length * 9.2 + 18);
    const box = (dy) => [it.x - w / 2, it.y + dy, it.x + w / 2, it.y + dy + 26];
    const hits = (r) => placed.some((q) => r[0] < q[2] && q[0] < r[2] && r[1] < q[3] && q[1] < r[3]);
    const dy = [-44, 16, -74, 46].find((d) => !hits(box(d))) ?? -44;
    placed.push(box(dy));
    it.dy = dy;
  }
  for (const it of order) out.push(labelSVG(it.x, it.y, it.text, it.cls, it.dy));
  return out.join("");
}
{
  const s = document.createElement("style");
  s.textContent = `
.fb-label circle { fill: #fff3c4; stroke: #2a2140; stroke-width: 3; }
.fb-label rect { fill: #16121fdd; stroke: #fff3c488; stroke-width: 1.5; }
.fb-label text { fill: #fff3c4; font: 700 15px var(--ui); text-anchor: middle; }
.fb-label.here circle { fill: var(--go); r: 13; }
.fb-label.here rect { fill: var(--go); stroke: var(--go); }
.fb-label.here text { fill: var(--go-ink); }`;
  document.head.append(s);
}

/* The map maker: a town laid with the fair's tiles, for a story's world.
   Deal one from seed words (the same words deal the same town), or lay it by
   hand: pick a tile, tap a spot, tap it to turn, Place; every edge it touches
   must match. Lift takes a tile back up. Name puts a name on a square, a well,
   a crossing, a basin, a bridge, a stall or a landing: each named one is a
   place in the world, and the Table lights it when a scene is there, and
   write.py offers it when a story asks where. Save gives the map as a file
   for box/maps/; nothing here is kept on its own. */
const MAPS = GAME.maps || [], WORLDS = GAME.worlds || [];
let M, mode = "lay", pick = "lane", rot = 0, spot = null, naming = null, board = null;

function blank(world, set = SET_OF_WORLD[world] || "fair") { return { world, set, seed: "", tiles: new Map([[key(0, 0), { x: 0, y: 0, id: "start", rot: 0, set, stalls: stallsOf("start").map((s) => ({ ...s, good: null })) }]]), places: [] }; }
function fromMap(m) { return { world: m.world, set: m.set || "fair", seed: m.seed || "", tiles: mapTiles(m), places: m.places.map((p) => ({ ...p })) }; }
/* the world being mapped: its map from box/maps if it has one, else a town dealt for it */
function openWorld(world) {
  const m = MAPS.find((x) => x.world === world);
  M = m ? fromMap(m) : blank(world);
  spot = null; naming = null;
  if (m) { board.fit(M.tiles.values()); render(); } else deal(seedWords(), 24);
}
const tileOf = (x, y, id, r) => ({ x, y, id, rot: r, set: M ? M.set : "fair", stalls: stallsOf(id).map((s) => ({ ...s, good: null })) });

function fitsHere(x, y, id, r) {
  if (M.tiles.has(key(x, y))) return false;
  let touches = false;
  for (let d = 0; d < 4; d++) {
    const nb = M.tiles.get(key(x + DIRS[d][0], y + DIRS[d][1]));
    if (!nb) continue;
    touches = true;
    if (edgeOf(id, r, d) !== edgeOf(nb.id, nb.rot, (d + 2) % 4)) return false;
  }
  return touches || M.tiles.size === 0;
}
function openSpots() {
  const out = new Map();
  for (const t of M.tiles.values()) for (const [dx, dy] of DIRS) { const k = key(t.x + dx, t.y + dy); if (!M.tiles.has(k)) out.set(k, [t.x + dx, t.y + dy]); }
  return [...out.values()];
}

/* a town dealt from seed words: the fair's tiles shuffled by the words, each
   set at a spot the words pick among those it fits */
function deal(words, size) {
  const rng = Stream.fromText(`lantern-map:${words}`);
  M = blank(M ? M.world : "lantern-fair", M ? M.set : "fair");
  M.seed = words;
  const pool = rng.shuffled(TILES.filter((t) => t.id !== "start").flatMap((t) => Array(t.n).fill(t.id)));
  for (const id of pool) {
    if (M.tiles.size >= size) break;
    const ok = [];
    for (const [x, y] of openSpots()) for (let r = 0; r < 4; r++) if (fitsHere(x, y, id, r)) ok.push([x, y, r]);
    if (!ok.length) continue;
    const [x, y, r] = rng.pick(ok);
    M.tiles.set(key(x, y), tileOf(x, y, id, r));
  }
  spot = null; naming = null;
  board.fit(M.tiles.values());
  render();
}

function landmarkNear(bx, by) {
  let best = null;
  for (const t of M.tiles.values()) for (const lm of landmarks(t.id, M.set)) {
    const [px, py] = onBoard(t, ...lm.at), d = Math.hypot(px - bx, py - by);
    if (d < 34 && (!best || d < best.d)) best = { d, at: `${key(t.x, t.y)}:${lm.k}`, kind: lm.kind };
  }
  return best;
}
function tapBoard(bx, by) {
  const x = Math.floor(bx / 100), y = Math.floor(by / 100);
  if (mode === "lay") {
    if (M.tiles.has(key(x, y)) || !openSpots().some(([a, b]) => a === x && b === y)) return;
    spot = [x, y];
    if (!fitsHere(x, y, pick, rot)) for (let r = 1; r < 4; r++) if (fitsHere(x, y, pick, (rot + r) % 4)) { rot = (rot + r) % 4; break; }
  } else if (mode === "lift") {
    if (!M.tiles.has(key(x, y)) || M.tiles.size === 1) return;
    M.tiles.delete(key(x, y));
    M.places = M.places.filter((p) => !p.at.startsWith(key(x, y) + ":"));
  } else {
    const lm = landmarkNear(bx, by);
    naming = lm ? { at: lm.at, kind: lm.kind } : null;
  }
  render();
}
function placeTile() {
  if (!spot) return frame.refuse("tap a spot beside the town first");
  if (!fitsHere(spot[0], spot[1], pick, rot)) return frame.refuse("every edge it touches has to match: canal to canal, lane to lane, square to square, quay to quay");
  M.tiles.set(key(...spot), tileOf(spot[0], spot[1], pick, rot));
  spot = null;
  render();
}
function nameIt(name) {
  name = name.trim();
  if (!naming) return;
  M.places = M.places.filter((p) => p.at !== naming.at);
  if (name) {
    if (M.places.some((p) => p.name.toLowerCase() === name.toLowerCase())) return frame.refuse(`${name} is already a place on this map`);
    M.places.push({ name, at: naming.at });
  }
  naming = null;
  render();
}
function saved() {
  const tiles = [...M.tiles.values()].sort((a, b) => a.y - b.y || a.x - b.x).map((t) => [t.x, t.y, t.id, t.rot]);
  return { world: M.world, ...(M.set !== "fair" ? { set: M.set } : {}), seed: M.seed, tiles, places: M.places.slice().sort((a, b) => a.name.localeCompare(b.name)) };
}
/* written the way box/maps keeps it: one tile a line, so a change reads in a diff */
function savedText() {
  const m = saved();
  return `{\n "world": ${JSON.stringify(m.world)},\n${m.set ? ` "set": ${JSON.stringify(m.set)},\n` : ""} "seed": ${JSON.stringify(m.seed)},\n "tiles": [\n${m.tiles.map((t) => `  ${JSON.stringify(t)}`).join(",\n")}\n ],\n "places": [\n${m.places.map((p) => `  ${JSON.stringify(p)}`).join(",\n")}\n ]\n}\n`;
}

function boardSVG() {
  let s = FAIR_DEFS;
  if (mode === "lay") for (const [x, y] of openSpots()) s += `<rect x="${x * 100 + 4}" y="${y * 100 + 4}" width="92" height="92" rx="8" class="lf-spot"/>`;
  for (const t of M.tiles.values()) s += tileG(t.x, t.y, t.id, t.rot, t.stalls, "", M.set);
  if (mode === "lift") for (const t of M.tiles.values()) if (M.tiles.size > 1) s += `<rect x="${t.x * 100 + 3}" y="${t.y * 100 + 3}" width="94" height="94" class="mm-lift"/>`;
  if (mode === "name") for (const t of M.tiles.values()) for (const lm of landmarks(t.id, M.set)) {
    const at = `${key(t.x, t.y)}:${lm.k}`;
    if (M.places.some((p) => p.at === at)) continue;
    const [px, py] = onBoard(t, ...lm.at);
    s += `<circle cx="${px}" cy="${py}" r="14" class="mm-spot ${naming && naming.at === at ? "on" : ""}"/>`;
  }
  s += labelsSVG(M.places.map((p) => [p, placeAt(M.tiles, p.at)]).filter(([, w]) => w).map(([p, w]) => ({ x: w.pt[0], y: w.pt[1], text: p.name, cls: naming && naming.at === p.at ? "here" : "" })));
  if (mode === "lay" && spot) {
    const ok = fitsHere(spot[0], spot[1], pick, rot);
    s += tileG(spot[0], spot[1], pick, rot, null, `opacity="0.9"`, M.set) + `<rect x="${spot[0] * 100 + 1.5}" y="${spot[1] * 100 + 1.5}" width="97" height="97" class="lf-held ${ok ? "ok" : "no"}"/>`;
  }
  return s;
}

function render() {
  const worldName = (WORLDS.find((w) => w.id === M.world) || {}).title || M.world;
  if (!document.getElementById("mm-wrap")) {
    frame.stage(`<div class="mm"><div class="mm-head"><div class="mm-modes" role="group" aria-label="what a tap does">${[["lay", "Lay"], ["lift", "Lift"], ["name", "Name"]].map(([k, l]) => `<button class="lf-kind" data-mode="${k}">${l}</button>`).join("")}</div>
      <div class="mm-deal"><select id="mm-world" aria-label="which world">${WORLDS.map((w) => `<option value="${esc(w.id)}">${esc(w.title)}</option>`).join("")}</select><select id="mm-set" aria-label="the look">${Object.entries(SETS).map(([k, v]) => `<option value="${k}">looks like ${esc(v.name)}</option>`).join("")}</select></div>
      <div class="mm-deal"><input id="mm-seed" aria-label="seed words" placeholder="seed words"><select id="mm-size" aria-label="how many tiles">${[16, 24, 36, 48].map((n) => `<option ${n === 24 ? "selected" : ""}>${n}</option>`).join("")}</select><button class="btn ghost" id="mm-deal">Deal</button></div></div>
      <div class="lf-wrap fb-wrap" id="mm-wrap"><svg id="mm-svg" class="fb-svg"></svg></div><div class="lf-bottom" id="mm-bottom"></div></div>`);
    board = new FairBoard(document.getElementById("mm-svg"), document.getElementById("mm-wrap"), tapBoard, { min: 640 });
    document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { mode = b.dataset.mode; spot = null; naming = null; render(); }));
    document.getElementById("mm-world").onchange = (e) => openWorld(e.target.value);
    document.getElementById("mm-set").onchange = (e) => { M.set = e.target.value; for (const t of M.tiles.values()) t.set = M.set; render(); };
    document.getElementById("mm-deal").onclick = () => deal(document.getElementById("mm-seed").value.trim() || seedWords(), +document.getElementById("mm-size").value);
    board.fit(M.tiles.values());
  }
  document.querySelectorAll("[data-mode]").forEach((b) => { b.classList.toggle("on", b.dataset.mode === mode); b.setAttribute("aria-pressed", b.dataset.mode === mode); });
  document.getElementById("mm-seed").value = M.seed;
  document.getElementById("mm-world").value = M.world;
  document.getElementById("mm-set").value = M.set;
  board.lastTiles = [...M.tiles.values()];
  board.apply();
  document.getElementById("mm-svg").innerHTML = boardSVG();
  let bottom = "";
  if (mode === "lay") {
    const palette = TILES.filter((t) => t.id !== "start").map((t) => `<button class="mm-pal ${t.id === pick ? "on" : ""}" data-pick="${t.id}" aria-label="${tileName(t.id)}"><svg viewBox="0 0 100 100" width="52" height="52">${tileG(0, 0, t.id, 0, null, "", M.set)}</svg></button>`).join("");
    bottom = `<div class="mm-palette" role="group" aria-label="tiles">${palette}</div><button class="lf-hand" id="mm-turn" aria-label="the tile: tap to turn it"><svg viewBox="0 0 100 100" width="72" height="72">${tileG(0, 0, pick, rot, null, "", M.set)}</svg><span>tap to turn</span></button><button class="btn" id="mm-place" ${spot ? "" : "disabled"}>Place</button>`;
  } else if (mode === "lift") bottom = `<div class="lf-ask">Tap a tile to lift it.</div>`;
  else if (naming) {
    const free = (WORLDS.find((w) => w.id === M.world) || { places: [] }).places.filter((p) => !M.places.some((q) => q.name.toLowerCase() === p.toLowerCase()));
    const cur = M.places.find((p) => p.at === naming.at);
    bottom = `<div class="mm-name"><label>Name this ${esc(naming.kind)}<input id="mm-name" value="${esc(cur ? cur.name : "")}" placeholder="The lantern bridge"></label>${free.length ? `<div class="mm-chips">${free.map((p) => `<button class="mm-chip" data-name="${esc(p)}">${esc(p)}</button>`).join("")}</div>` : ""}<div class="mm-row"><button class="btn" id="mm-ok">Name it</button>${cur ? `<button class="btn ghost" id="mm-unname">Take the name off</button>` : ""}</div></div>`;
  } else { const pl = Object.values(skinOf(M.set).places); bottom = `<div class="lf-ask">Tap a ring to name a ${pl.slice(0, -1).join(", ")} or ${pl[pl.length - 1]}.</div>`; }
  document.getElementById("mm-bottom").innerHTML = bottom;
  document.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => { pick = b.dataset.pick; rot = 0; if (spot && !fitsHere(spot[0], spot[1], pick, rot)) for (let r = 1; r < 4; r++) if (fitsHere(spot[0], spot[1], pick, r)) { rot = r; break; } render(); }));
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on("mm-turn", () => { rot = (rot + 1) % 4; render(); });
  on("mm-place", placeTile);
  on("mm-ok", () => nameIt(document.getElementById("mm-name").value));
  on("mm-unname", () => nameIt(""));
  document.querySelectorAll("[data-name]").forEach((b) => (b.onclick = () => nameIt(b.dataset.name)));
  const nm = document.getElementById("mm-name");
  if (nm) { nm.onkeydown = (e) => { if (e.key === "Enter") nameIt(nm.value); }; }
  frame.status(`<b>${esc(worldName)}</b>: ${M.tiles.size} tiles, ${M.places.length} place${M.places.length === 1 ? "" : "s"} named${M.seed ? ` · dealt from “${esc(M.seed)}”` : ""}`);
  frame.panel("places", "The places on the map", M.places.length ? `<ul class="lf-rules">${M.places.slice().sort((a, b) => a.name.localeCompare(b.name)).map((p) => `<li><b>${esc(p.name)}</b> · ${esc(placeAt(M.tiles, p.at)?.lm.kind || "")}</li>`).join("")}</ul>` : `<p class="note">None named yet: choose Name and tap a ring.</p>`);
  frame.panel("save", "Save the map", `<p class="note">Kept as <code>box/maps/${esc(M.world)}.json</code>, beside the world. The Table and write.py read it from there.</p><div class="mm-row"><button class="btn" id="mm-copy">Copy</button><button class="btn ghost" id="mm-down">Download</button></div><pre class="mm-json" id="mm-json">${esc(savedText())}</pre>`);
  on("mm-copy", async () => { try { await navigator.clipboard.writeText(savedText()); frame.status("<b>Copied.</b> Paste it into box/maps/" + esc(M.world) + ".json."); } catch (e) { frame.refuse("the browser wouldn't copy; select the text below instead"); } });
  on("mm-down", () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([savedText()], { type: "application/json" })); a.download = `${M.world}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
}

const style = document.createElement("style");
style.textContent = `

.mm > * { min-width: 0; }
.mm-head { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.mm-modes, .mm-deal, .mm-row, .mm-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mm-deal input, .mm-deal select, .mm-name input { font: inherit; color: var(--chalk); background: #0006; border: 1px solid var(--edge); border-radius: 9px; padding: 9px 10px; min-height: 44px; }
.mm-deal input { width: 11em; }
.lf-wrap { height: min(58vh, 560px); min-height: 300px; }
.lf-kind { padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 2px solid var(--edge); font-weight: 800; }
.lf-kind.on { border-color: var(--go); color: var(--go); }
.lf-spot { fill: #ffffff08; stroke: #ffffff40; stroke-width: 2; stroke-dasharray: 8 6; }
.lf-held { fill: none; stroke-width: 4; } .lf-held.ok { stroke: var(--go); } .lf-held.no { stroke: #ff7a66; stroke-dasharray: 10 6; }
.mm-lift { fill: #ff7a6612; stroke: #ff7a6680; stroke-width: 2; stroke-dasharray: 6 6; }
.mm-spot { fill: #ffcf5a22; stroke: var(--go); stroke-width: 3; stroke-dasharray: 5 4; }
.mm-spot.on { fill: var(--go); }
.lf-bottom { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 90px; }
.mm-palette { display: flex; gap: 6px; overflow-x: auto; width: 100%; min-width: 0; padding: 4px 2px 8px; flex: 1 1 100%; }
.mm-pal { flex: none; border-radius: 8px; border: 2px solid transparent; line-height: 0; }
.mm-pal.on { border-color: var(--go); }
.mm-pal svg { border-radius: 5px; }
.lf-hand { display: grid; justify-items: center; gap: 2px; padding: 6px; border-radius: 12px; border: 2px solid var(--go); background: #0006; }
.lf-hand span { font-size: 0.7rem; color: var(--chalk-dim); }
.lf-ask { font-weight: 700; text-align: center; }
.mm-name { display: grid; gap: 10px; width: 100%; max-width: 480px; }
.mm-name label { display: grid; gap: 6px; font-weight: 700; }
.mm-chip { padding: 8px 12px; min-height: 40px; border-radius: 999px; border: 1px solid var(--go); color: var(--go); font-weight: 700; }
.mm-json { margin: 0; max-height: 220px; overflow: auto; background: #00000055; border-radius: 8px; padding: 10px; font: 0.7rem/1.5 var(--mono); white-space: pre; }

.lf-rules b { color: var(--chalk); }`;
document.head.append(style);

frame.setup({ seats: false, score: false, deck: false, hints: false, redraw: () => render() });
document.getElementById("p-record").hidden = true;
document.getElementById("p-log").hidden = true;
M = MAPS.length ? fromMap(MAPS.find((m) => m.world === "lantern-fair") || MAPS[0]) : blank("lantern-fair");
render();
if (!MAPS.length) deal(seedWords(), 24);

</script>
